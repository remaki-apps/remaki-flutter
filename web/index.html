<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Remaki - PG Management App">

  <!-- Prevent browser from caching index.html itself -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- iOS PWA meta tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Remaki">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- iOS touch icons -->
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <!-- iOS splash screens - portrait -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Theme color for browser chrome (Android) and iOS status bar -->
  <meta name="theme-color" content="#1E1B4B">
  <meta name="msapplication-navbutton-color" content="#1E1B4B">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Remaki</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // ──────────────────────────────────────────────────────────────────────────
    // Service Worker Update Detector
    // When a new version of the app is deployed, the new service worker is
    // installed but stays in "waiting" state. This script detects that and
    // automatically reloads the page so users always see the latest version
    // without manually clearing their cache.
    // ──────────────────────────────────────────────────────────────────────────
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        // New SW has taken control — reload once to get the latest assets
        window.location.reload();
      });

      navigator.serviceWorker.ready.then(function (registration) {
        // Check for updates every 60 seconds while the app is open
        setInterval(function () {
          registration.update().catch(function () {});
        }, 60 * 1000);

        if (registration.waiting) {
          // A new SW is already waiting — skip waiting and activate immediately
          registration.waiting.postMessage({ type: 'SKIP_WAITING' });
        }

        registration.addEventListener('updatefound', function () {
          var newWorker = registration.installing;
          if (!newWorker) return;

          newWorker.addEventListener('statechange', function () {
            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
              // New version installed and old SW is in control — activate new one immediately
              newWorker.postMessage({ type: 'SKIP_WAITING' });
            }
          });
        });
      });
    }
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
