<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Remaki - PG Management App">

  <!-- iOS PWA meta tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Remaki">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- iOS touch icons -->
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <!-- Theme color for browser chrome (Android) and iOS status bar -->
  <meta name="theme-color" content="#1E1B4B">
  <meta name="msapplication-navbutton-color" content="#1E1B4B">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Remaki</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // ──────────────────────────────────────────────────────────────────────────
    // Service Worker Registration
    // Simple registration — no auto-reload on SW update to prevent refresh loops.
    // ──────────────────────────────────────────────────────────────────────────
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register(
        'flutter_service_worker.js',
        { scope: '/' }
      ).then(function (registration) {
        console.log('[SW] Registered successfully');
      }).catch(function (err) {
        console.error('[SW] Registration failed:', err);
      });
    }
  </script>
</head>
<body>
  <!-- Loading indicator shown while Flutter initializes -->
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    #loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      z-index: -1;
    }
  </style>

  <div id="loading">
    <div style="text-align: center;">
      <div style="font-size: 24px; margin-bottom: 20px;">🏠 Remaki</div>
      <div style="animation: spin 1s linear infinite;">⏳</div>
      <div style="margin-top: 20px; font-size: 14px;">Loading...</div>
    </div>
  </div>

  <style>
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>

  <!-- Flutter app entry point -->
  <script src="flutter_bootstrap.js" async></script>
  
  <script>
    // Hide loading indicator when Flutter is ready
    window.addEventListener('load', function() {
      const loading = document.getElementById('loading');
      if (loading) {
        loading.style.display = 'none';
      }
    });
  </script>
</body>
</html>
